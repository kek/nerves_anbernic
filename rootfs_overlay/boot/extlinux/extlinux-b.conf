label linux
  kernel /boot/Image
  # See extlinux-a.conf for why the device tree is named explicitly.
  fdt /boot/sun50i-h700-anbernic-rg40xx-v.dtb
  # Debugging options: drop "quiet" and add "ignore_loglevel earlycon"
  append console=ttyS0,115200 root=/dev/mmcblk0p3 rootfstype=squashfs rootwait quiet
