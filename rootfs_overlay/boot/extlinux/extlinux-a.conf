label linux
  kernel /boot/Image
  # The device tree MUST be named explicitly. U-Boot's own built-in DTB is
  # sun50i-h700-anbernic-rg35xx-2024, which leaves mmc1 disabled -- booting
  # on it yields a board with no WiFi and the wrong model string.
  fdt /boot/sun50i-h700-anbernic-rg40xx-v.dtb
  # console=tty0 puts the kernel log on the panel through fbcon, which is the
  # only console this board actually has -- UART0 is on internal test pads.
  # ttyS0 stays first so it remains /dev/console for anyone who solders to
  # them. "quiet" is deliberately absent: a silent screen cannot be told apart
  # from a screen that never came up.
  # Further debugging options: add "ignore_loglevel earlycon"
  #
  # root= names mmcblk0 by number, and since the second card slot was enabled
  # (see &mmc2 in linux/sun50i-h700-anbernic-rg40xx-v.dts) this board can have
  # two cards in it. That number is NOT pinned by the device tree: mmc_blk_alloc()
  # in drivers/mmc/core/block.c takes it from its own IDA in the order cards
  # finish initialising, not from the host index, so no mmc alias can fix it.
  # In practice mmc0 wins comfortably -- it is probed, and its rescan queued,
  # before mmc2 is probed at all -- but it is a race and not a guarantee.
  # The real fix is root=PARTUUID=, which needs the partition table to carry
  # one; that is a boot-layout change and deliberately out of scope here.
  append console=ttyS0,115200 console=tty0 root=/dev/mmcblk0p2 rootfstype=squashfs rootwait
