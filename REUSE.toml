version = 1

[[annotations]]
path = [
 ".formatter.exs",
 ".github/**",
 ".gitignore",
 "CHANGELOG.md",
 "nerves_defconfig",
 "REUSE.toml",
 "mix.exs",
 "mix.lock",
 "VERSION",
 "docs/**",
 "tools/**"
]
precedence = "aggregate"
SPDX-FileCopyrightText = "None"
SPDX-License-Identifier = "CC0-1.0"

[[annotations]]
path = [
 "README.md"
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Karl Eklund"
SPDX-License-Identifier = "CC-BY-4.0"

# Buildroot derived or related files
# NOTE: packages here proactively have copyright assigned to the Buildroot
# developers to avoid worrying about copyright assignment when upstreaming.
[[annotations]]
path = [
 "Config.in",
 "package/**",
 "external.mk",
 "post-build.sh",
 "post-createfs.sh"
]
precedence = "aggregate"
SPDX-FileCopyrightText = "The Buildroot developers <buildroot@buildroot.org>"
SPDX-License-Identifier = "GPL-2.0-or-later"

# Linux kernel derived or related files.
#
# The board device tree is derived from the ROCKNIX/Batocera
# sun50i-h700-anbernic-rg40xx-v.dts by Philippe Simons, itself extending
# mainline work by Ryan Walklin and Chris Morgan. Dual-licensed upstream, so
# the SPDX header in the file itself is authoritative and takes precedence.
[[annotations]]
path = [
 "linux/nerves.fragment",
 "linux/linux-*.defconfig"
]
precedence = "override"
SPDX-FileCopyrightText = "Various"
SPDX-License-Identifier = "GPL-2.0-only"

# Kernel patches. Each carries its own author in its git-format-patch header;
# the display series (0100-0103) is taken from ROCKNIX, which is in turn
# carrying work by Jernej Skrabec, Philippe Simons, Ryan Walklin, Chris Morgan
# and kikuchan. Two of them are upstream submissions still in flight.
[[annotations]]
path = [
 "patches/**"
]
precedence = "aggregate"
SPDX-FileCopyrightText = "Various kernel contributors"
SPDX-License-Identifier = "GPL-2.0-only"

# Panel description blobs, from ROCKNIX's kernel-firmware package. These carry
# the panel timings and the controller init sequence that the generic
# panel-mipi-dpi-spi driver loads at probe time; there is no source form.
[[annotations]]
path = [
 "rootfs_overlay/lib/firmware/panels/*.panel"
]
precedence = "aggregate"
SPDX-FileCopyrightText = "The ROCKNIX contributors"
SPDX-License-Identifier = "GPL-2.0-only"

# U-Boot derived or related files
[[annotations]]
path = [
 "uboot/*"
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2000-2013 Wolfgang Denk, DENX Software Engineering, wd@denx.de"
SPDX-License-Identifier = "GPL-2.0-or-later"

# Fwup config files
[[annotations]]
path = [
 "fwup-ops.conf",
 "fwup.conf",
 "fwup_include/*"
]
precedence = "aggregate"
SPDX-FileCopyrightText = "None"
SPDX-License-Identifier = "CC0-1.0"

# Various config files
[[annotations]]
path = [
 "rootfs_overlay/etc/boardid.config",
 "rootfs_overlay/etc/erlinit.config",
 "rootfs_overlay/etc/fw_env.config",
 "rootfs_overlay/boot/extlinux/extlinux-a.conf",
 "rootfs_overlay/boot/extlinux/extlinux-b.conf",
 "rootfs_overlay/mnt/boot/.empty"
]
precedence = "aggregate"
SPDX-FileCopyrightText = "None"
SPDX-License-Identifier = "CC0-1.0"
