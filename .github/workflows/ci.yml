name: CI

on:
  push:
  pull_request:

# A from-scratch Buildroot build takes the better part of an hour, so pushes
# arriving faster than that used to stack up runs that were already superseded
# -- four were queued at once during bring-up. Only the newest ref matters.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  OTP_VERSION: "29.0.4"
  ELIXIR_VERSION: "1.20.2-otp-29"
  NERVES_BOOTSTRAP_VERSION: "1.17.0"
  KERNEL_VERSION: "6.18.44"

jobs:
  # Cheap checks that catch the failures which would otherwise only show up
  # after flashing a card. Deliberately separate from the system build so
  # they report in a couple of minutes rather than an hour.
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify the image layout is self-consistent
        run: tools/check-consistency.sh

      - name: Verify the board device tree
        run: tools/check-dts.sh "$KERNEL_VERSION"

      - name: Verify the kernel defconfig is in sync with nerves.fragment
        run: |
          tools/gen-kernel-defconfig.sh "$KERNEL_VERSION"
          if ! git diff --exit-code -- linux/; then
            echo
            echo "linux/linux-*.defconfig is out of sync with linux/nerves.fragment."
            echo "Run tools/gen-kernel-defconfig.sh and commit the result."
            exit 1
          fi

  # There is deliberately no separate lint job. mix nerves.system.lint cannot
  # run without a built system: in the system's own repository Nerves.Env
  # insists on a real NERVES_SYSTEM directory, and tolerates a missing one only
  # when the system is a path dependency of some other project. So the old lint
  # job spent 1h6m building the whole of Buildroot before it could lint one
  # text file -- the build was load-bearing, not incidental -- and duplicated
  # what build-system already does. Neither NERVES_ENV_DISABLED nor pointing
  # NERVES_SYSTEM at an empty directory avoids it; the first trades the hour
  # for "path which does not exist" and the second for "the system hasn't been
  # built!". The linter therefore runs as a step of build-system below, where a
  # system exists and it costs about a second.
  #
  # The consequence is that the defconfig is linted on trunk and tags but not
  # on branches. That is the same trade build-system already makes, and the
  # invariants that actually break an image -- partition offsets, the U-Boot
  # environment location, the DTB name, the panel firmware -- are asserted by
  # tools/check-consistency.sh in the checks job on every push.

  build-system:
    # Building Buildroot from scratch takes the better part of an hour, so
    # only do it where the result is worth having.
    if: github.ref == 'refs/heads/trunk' || github.ref_type == 'tag'
    needs: [checks]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Free up disk space
        # A Buildroot output tree does not fit next to everything the hosted
        # runner image preinstalls.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -h /

      - uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ env.OTP_VERSION }}
          elixir-version: ${{ env.ELIXIR_VERSION }}

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            automake bc build-essential cmake cpio curl git libncurses5-dev \
            libssl-dev pkg-config squashfs-tools unzip wget

      - name: Install Nerves tooling
        run: |
          mix local.hex --force
          mix local.rebar --force
          mix archive.install hex nerves_bootstrap "$NERVES_BOOTSTRAP_VERSION" --force

      - name: Build the system
        run: |
          mix deps.get
          mix compile

      - name: Lint the Buildroot defconfig
        # Cheap here because the system is already built; see the note above
        # for why this cannot be its own job.
        #
        # `ensure_value: BR2_GLOBAL_PATCH_DIR` is reported as a failed check and
        # that is expected: the rule wants exactly the nerves patch directory
        # while we legitimately list two, nerves' and ours. The single-argument
        # form of the task does not set a non-zero exit status, so this stays
        # advisory -- do not "fix" it by dropping our patch directory.
        run: mix nerves.system.lint nerves_defconfig

      - name: Archive the built system
        run: mix nerves.artifact

      - uses: actions/upload-artifact@v4
        with:
          name: nerves_system_rg40xxv
          path: "*.tar.gz"
          if-no-files-found: error
